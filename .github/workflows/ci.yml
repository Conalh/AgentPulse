name: CI

on:
  push:
    branches: [main]
  pull_request:

# Run on both Ubuntu and Windows. Windows matters disproportionately here:
# half the v0.2.x changelog is Windows-terminal / Windows-path fixes (alt
# screen buffer, case-insensitive watcher, slug decoder Windows-drive
# handling). Catching regressions on win32 in CI > catching them in
# screenshots from real users.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Smoke test: the dist binary actually boots and prints usage. Catches
      # shebang / bin path / dist-file-array breakage that the unit tests
      # don't.
      - name: CLI smoke test
        run: node dist/cli.js --help
