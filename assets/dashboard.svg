  <!-- Signals -->
  <text x="28" y="398" fill="#c0caf5">Signals:</text>
  <text x="28" y="416" fill="#c0caf5">  <tspan fill="#565f89">·</tspan> top cluster <tspan fill="#a9b1d6">src/auth</tspan> covers 86% of activity</text>
  <text x="28" y="434" fill="#c0caf5">  <tspan fill="#565f89">·</tspan> tests recovered to green (2 edit→verify cycles)</text>
  <text x="28" y="452" fill="#c0caf5">  <tspan fill="#565f89">·</tspan> 4 edits across 1 file</text>

  <!-- Activity sparkline -->
  <text x="28" y="488">
    <tspan fill="#c0caf5">Activity: </tspan>
    <tspan fill="#9ece6a">▁▂▃▅▆▇█</tspan>
    <tspan fill="#7aa2f7">▆▅▄</tspan>
    <tspan fill="#9ece6a">▅▆▇█</tspan>
    <tspan fill="#7aa2f7">▆▄▃▂</tspan>
    <tspan fill="#565f89">  (84 events over 14 min)</tspan>
