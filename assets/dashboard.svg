    <tspan fill="#9ece6a">●</tspan>
    <tspan fill="#c0caf5">  </tspan>
    <tspan fill="#7dcfff" font-weight="700">CC1</tspan>
    <tspan fill="#565f89"> · </tspan>
    <tspan fill="#c0caf5" font-weight="700">AgentPulse</tspan>
    <tspan fill="#565f89"> (claude-code)</tspan>
  </text>
  <text x="640" y="80" fill="#9ece6a">converging</text>
  <text x="1072" y="80" fill="#565f89" text-anchor="end">updated 6s ago</text>

  <!-- Row 2: aliased CC2, also converging — note hex tail is suppressed
