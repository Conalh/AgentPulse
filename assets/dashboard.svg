<?xml version="1.0" encoding="UTF-8"?>
<!--
  AgentPulse dashboard, v0.6.1 — README hero image.

  Static SVG mockup of `npx @conalh/agentpulse@latest live` showing every
  feature shipped in the v0.4.x–v0.6.1 arc:

    - Project clustering (v0.4.5): same-project sessions adjacent
    - Agent aliases (v0.4.7): `CC1`, `CC2`, `frontend` lead the row
    - Hex-tail disambiguator (v0.4.4): unaliased same-project rows
    - Verdict hysteresis (v0.5.4): pill colour is the consensus
    - Path-truncated narrative (v0.5.3, v0.6.1): `…/auth/session.ts`
    - Converging classifier fix (v0.6.1): real TDD now reads as converging
    - The footer's RAGE mark and the full keybind hint bar

  Hand-laid at monospace 13px, ~7.8px char width, 18px line height.
  Render with any SVG viewer / GitHub README image embed.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1100 640"
     width="1100" height="640"
     font-family="'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace"
     font-size="13">

  <!-- Background. Tokyo Night–ish dark, kind to the pill colours. -->
  <rect x="0" y="0" width="1100" height="640" fill="#1a1b26"/>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- Header box: brand + session count                                -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <rect x="12" y="12" width="1076" height="36"
        rx="8" ry="8"
        fill="none" stroke="#7dcfff" stroke-width="1"/>
  <text x="28" y="34" fill="#c0caf5">
    <tspan font-weight="700">AgentPulse</tspan><tspan fill="#565f89"> · by </tspan><tspan font-weight="700" fill="#f7768e">RAGE</tspan>
  </text>
  <text x="1072" y="34" fill="#565f89" text-anchor="end">7 sessions, refresh 30s</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- Session list                                                     -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <rect x="12" y="56" width="1076" height="146"
        rx="8" ry="8"
        fill="none" stroke="#414868" stroke-width="1"/>

